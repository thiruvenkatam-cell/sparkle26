spring.application.name=sparkle26-backend
# Load backend/.env (VOLUNTEER_API_KEY, ADMIN_API_KEY...) when it exists. Run the backend from the backend/ folder.
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sparkle26}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
# Supabase free pooler has small connection limits
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never

# ---- Gmail SMTP (App Password venum) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# ---- App ----
app.site-url=${SITE_URL:http://localhost:5173}

# Env vars read directly in code (do NOT redefine here, it creates a circular placeholder):
#   VOLUNTEER_API_KEY    -> AttendanceController (check-in portal key)
#   ADMIN_API_KEY        -> AdminPaymentController (payment approval key)
#   APP_ALLOWED_ORIGINS  -> WebConfig (CORS, comma separated)
